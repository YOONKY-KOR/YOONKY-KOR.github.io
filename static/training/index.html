<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>KY Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0A0A0C;color:#E8E6E0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{display:none;}

/* 잠금 화면 */
#lock-screen{
  position:fixed;inset:0;background:#0A0A0C;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding:40px 32px;
}
#lock-screen .logo{font-size:13px;letter-spacing:0.16em;color:rgba(232,230,224,0.3);text-transform:uppercase;}
#lock-screen .title{font-size:28px;font-weight:700;text-align:center;}
#lock-screen .subtitle{font-size:14px;color:rgba(232,230,224,0.4);text-align:center;}
#lock-screen input{
  width:100%;max-width:280px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;padding:14px 18px;
  color:#E8E6E0;font-size:16px;font-family:inherit;
  text-align:center;letter-spacing:0.1em;
  outline:none;transition:border-color 0.2s;
}
#lock-screen input:focus{border-color:rgba(0,200,150,0.5);}
#lock-screen input.error{border-color:rgba(255,80,80,0.6);animation:shake 0.3s ease;}
#lock-screen .btn{
  width:100%;max-width:280px;
  background:#00C896;border:none;border-radius:12px;
  padding:14px;color:#0A0A0C;font-size:15px;font-weight:700;
  cursor:pointer;transition:opacity 0.2s;
}
#lock-screen .btn:active{opacity:0.8;}
#lock-screen .hint{font-size:12px;color:rgba(232,230,224,0.25);}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 앱 */
#app{display:none;padding-bottom:220px;max-width:430px;margin:0 auto;}
#app.visible{display:block;}

/* 헤더 */
.header{
  padding:20px 20px 0;
  border-bottom:1px solid rgba(255,255,255,0.06);
  position:sticky;top:0;
  background:rgba(10,10,12,0.95);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  z-index:10;
}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.header-eyebrow{font-size:11px;letter-spacing:0.12em;color:rgba(232,230,224,0.4);text-transform:uppercase;margin-bottom:2px;}
.header-title{font-size:20px;font-weight:700;line-height:1;}
.rpe-badge{
  border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;
  transition:all 0.3s;border:1px solid;
}

/* 탭 공통 */
.scroll-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none;}
.week-tabs{display:flex;gap:6px;margin-bottom:16px;}
.week-tab{flex:1;border-radius:8px;padding:8px 0;font-size:13px;font-weight:600;border:1px solid transparent;transition:all 0.2s;background:rgba(255,255,255,0.04);color:rgba(232,230,224,0.4);}
.day-tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:20px;}
.day-tab{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 4px;transition:all 0.2s;text-align:center;}
.day-tab.active{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.18);}
.day-tab-label{font-size:13px;font-weight:700;color:rgba(232,230,224,0.45);margin-bottom:3px;}
.day-tab.active .day-tab-label{color:#fff;}
.day-tab-type{font-size:9px;letter-spacing:0.06em;}

/* 세션 */
.body{padding:16px 20px 0;}
.session-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.session-title{font-size:18px;font-weight:700;}
.session-sub{font-size:12px;color:rgba(232,230,224,0.4);margin-top:2px;}
.session-count-num{font-size:13px;font-weight:600;text-align:right;}
.session-count-label{font-size:11px;color:rgba(232,230,224,0.3);}

/* 진행바 */
.progress-bar{height:3px;background:rgba(255,255,255,0.07);border-radius:2px;margin-bottom:20px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width 0.4s ease;}

/* 운동 카드 */
.exercises{display:flex;flex-direction:column;gap:10px;}
.ex-card{
  border-radius:14px;padding:14px 16px;
  transition:all 0.25s;
  display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  cursor:pointer;
}
.ex-card.no-action{cursor:default;}
.ex-num{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s;font-size:12px;font-weight:700;
  color:rgba(232,230,224,0.35);
}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:15px;font-weight:600;color:#E8E6E0;margin-bottom:5px;transition:color 0.25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid;}
.ex-note{font-size:11px;color:rgba(232,230,224,0.3);max-width:70px;text-align:right;line-height:1.4;flex-shrink:0;}
.ex-no-content{font-size:12px;color:rgba(232,230,224,0.35);}

/* 타이머 */
.timer-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(10,10,12,0.97);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.08);
  padding:14px 20px 28px;z-index:20;
}
.timer-inner{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
.timer-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
.timer-time{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:rgba(232,230,224,0.5);
  font-variant-numeric:tabular-nums;transition:color 0.3s;
}
.timer-controls{flex:1;}
.timer-label{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:rgba(232,230,224,0.4);letter-spacing:0.08em;}
.timer-btns{display:flex;gap:6px;}
.timer-btn{
  flex:1;padding:7px 0;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;font-size:11px;font-weight:600;
  color:rgba(232,230,224,0.45);transition:all 0.2s;font-family:inherit;
}
.timer-reset{
  width:34px;flex-shrink:0;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;color:rgba(232,230,224,0.35);
  display:flex;align-items:center;justify-content:center;
}
.timer-hints{display:flex;justify-content:space-between;padding-left:68px;}
.timer-hint{flex:1;font-size:9px;color:rgba(232,230,224,0.2);text-align:center;}
</style>
</head>
<body>

<!-- 잠금 화면 -->
<div id="lock-screen">
  <div class="logo">KY Training v1.1</div>
  <div>
    <div class="title">12주 트레이닝<br/>프로그램</div>
  </div>
  <div class="subtitle">비공개 운동 기록 앱</div>
  <input type="password" id="pw-input" placeholder="비밀번호 입력" autocomplete="off" autocorrect="off" spellcheck="false"/>
  <button class="btn" onclick="checkPw()">입장</button>
  <div class="hint">비밀번호를 입력하세요</div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-eyebrow">KY Training</div>
        <div class="header-title">12주 프로그램</div>
      </div>
      <div class="rpe-badge" id="rpe-badge"></div>
    </div>
    <div class="scroll-tabs" id="block-tabs"></div>
  </div>

  <div class="body">
    <div class="week-tabs" id="week-tabs"></div>
    <div class="day-tabs" id="day-tabs"></div>

    <div class="session-header">
      <div>
        <div class="session-title" id="session-title"></div>
        <div class="session-sub" id="session-sub"></div>
      </div>
      <div>
        <div class="session-count-num" id="count-num"></div>
        <div class="session-count-label">완료</div>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="exercises" id="exercises"></div>
  </div>

  <!-- 타이머 -->
  <div class="timer-bar">
    <div class="timer-inner">
      <div class="timer-ring">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3"/>
          <circle id="timer-arc" cx="26" cy="26" r="22" fill="none"
            stroke="rgba(255,255,255,0.2)" stroke-width="3"
            stroke-dasharray="138.23" stroke-dashoffset="0"
            stroke-linecap="round" transform="rotate(-90 26 26)"
            style="transition:stroke-dashoffset 0.9s linear,stroke 0.3s"/>
        </svg>
        <div class="timer-time" id="timer-time">1:30</div>
      </div>
      <div class="timer-controls">
        <div class="timer-label">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 3h6"/><path d="M12 3v2"/></svg>
          휴식 타이머
        </div>
        <div class="timer-btns">
          <button class="timer-btn" onclick="startTimer(60)">1m</button>
          <button class="timer-btn" onclick="startTimer(90)">1½m</button>
          <button class="timer-btn" onclick="startTimer(120)">2m</button>
          <button class="timer-btn" onclick="startTimer(180)">3m</button>
          <button class="timer-reset timer-btn" onclick="resetTimer()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="timer-hints">
      <div class="timer-hint">1분</div>
      <div class="timer-hint">1분30초</div>
      <div class="timer-hint">2분</div>
      <div class="timer-hint">3분</div>
      <div class="timer-hint" style="flex:0">초기화</div>
    </div>
  </div>
</div>

<script>
// ── 비밀번호 해시 (SHA-256 of "ky2024!") — 변경하려면 새 해시로 교체
// 현재 비밀번호: ky2024!
const PW_HASH = "c564111fa77efc6f9211971fab1f86221d07c8120714b746ba09f370e79d5731";

async function sha256(msg) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function checkPw() {
  const val = document.getElementById("pw-input").value;
  const hash = await sha256(val);
  if (hash === PW_HASH) {
    sessionStorage.setItem("ky_auth","1");
    document.getElementById("lock-screen").style.display = "none";
    document.getElementById("app").classList.add("visible");
    initApp();
  } else {
    const inp = document.getElementById("pw-input");
    inp.classList.add("error");
    inp.value = "";
    inp.placeholder = "틀렸습니다. 다시 시도";
    setTimeout(()=>{ inp.classList.remove("error"); inp.placeholder="비밀번호 입력"; },1000);
  }
}

document.getElementById("pw-input").addEventListener("keydown", e => { if(e.key==="Enter") checkPw(); });

// 세션 유지
if (sessionStorage.getItem("ky_auth") === "1") {
  document.getElementById("lock-screen").style.display = "none";
  document.getElementById("app").classList.add("visible");
  window.addEventListener("DOMContentLoaded", initApp);
}

// ── 데이터
const BLOCKS = [
  {id:1,label:"블록 1",sub:"볼륨",weeks:[1,2,3,4],rpe:"RPE 6–7",color:"#00C896"},
  {id:2,label:"블록 2",sub:"강도",weeks:[5,6,7,8],rpe:"RPE 7–8",color:"#4A9EFF"},
  {id:3,label:"블록 3",sub:"고중량",weeks:[9,10,11],rpe:"RPE 8–9",color:"#FF7A50"},
  {id:4,label:"디로드",sub:"회복",weeks:[12],rpe:"RPE 5–6",color:"#9B8FFF"},
];

const BASE_SESSIONS = {
  C:{label:"Day C",tag:"등 + 어깨",type:"개인",exercises:[
    {id:"c1",name:"랫풀다운 (바)",sets:4,reps:10,weight:"32kg",note:"광배 스트레치 집중"},
    {id:"c2",name:"시티드 케이블로우",sets:3,reps:12,weight:"가볍게",note:"어깨 뒤로 당기기"},
    {id:"c3",name:"체스트 서포티드로우",sets:3,reps:12,weight:"가볍게",note:"허리 부하 없음"},
    {id:"c4",name:"아놀드프레스",sets:3,reps:10,weight:"10kg",note:"찝힘 즉시 중단"},
    {id:"c5",name:"레터럴 레이즈",sets:3,reps:15,weight:"3kg",note:"측면 삼각근"},
    {id:"c6",name:"스트레이트암 풀다운",sets:2,reps:15,weight:"가볍게",note:"마무리 광배"},
  ]},
  D:{label:"Day D",tag:"하체 + 팔",type:"개인",exercises:[
    {id:"d1",name:"고블릿 스쿼트",sets:2,reps:15,weight:"16kg",note:"웜업 — 가동범위"},
    {id:"d2",name:"런지 (덤벨)",sets:4,reps:10,weight:"20kg",note:"각 발 기준"},
    {id:"d3",name:"시티드 레그컬",sets:4,reps:12,weight:"25kg",note:"선호 운동"},
    {id:"d4",name:"바벨컬",sets:3,reps:12,weight:"10kg",note:"상완이두 집중"},
    {id:"d5",name:"케이블컬",sets:2,reps:15,weight:"가볍게",note:"마무리 펌핑"},
    {id:"d6",name:"스탠딩 카프레이즈",sets:3,reps:20,weight:"체중",note:"종아리"},
  ]},
  A:{label:"Day A",tag:"수업 세션",type:"수업",exercises:[
    {id:"a1",name:"수업 내용",sets:null,reps:null,weight:null,note:"수업 공유 후 업데이트"},
  ]},
  B:{label:"Day B",tag:"수업 세션",type:"수업",exercises:[
    {id:"b1",name:"수업 내용",sets:null,reps:null,weight:null,note:"수업 공유 후 업데이트"},
  ]},
};

function scaleExercises(exercises, blockId) {
  return exercises.map(ex => {
    if(!ex.sets) return ex;
    const sets = blockId===1?ex.sets:blockId===2?Math.min(ex.sets+1,5):blockId===3?Math.min(ex.sets+1,5):Math.max(ex.sets-1,2);
    const reps = blockId===1?ex.reps:blockId===2?Math.max(ex.reps-2,6):blockId===3?Math.max(ex.reps-3,4):ex.reps+2;
    return {...ex,sets,reps};
  });
}

function hexToRgb(hex){
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)].join(",");
}

// ── 상태
let state = { block:1, week:1, day:"C" };
const STORAGE_KEY = "ky_training_v1";
function load(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");}catch{return{};} }
function save(d){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{} }
let completed = load();

// ── 타이머
let timerInterval = null;
let timerRemain = 90;
let timerPreset = 90;
let timerActive = false;

const CIRC = 2 * Math.PI * 22;

function startTimer(preset) {
  clearInterval(timerInterval);
  timerPreset = preset; timerRemain = preset; timerActive = true;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timerRemain--;
    if(timerRemain <= 0){ clearInterval(timerInterval); timerActive=false; timerRemain=0; }
    updateTimerUI();
  }, 1000);
  // 버튼 스타일
  document.querySelectorAll(".timer-btn").forEach((b,i)=>{
    const presets=[60,90,120,180];
    if(presets[i]===preset){ applyActiveTimerBtn(b, preset); }
    else { b.style.background="rgba(255,255,255,0.05)"; b.style.border="1px solid rgba(255,255,255,0.08)"; b.style.color="rgba(232,230,224,0.45)"; }
  });
}

function applyActiveTimerBtn(btn, preset) {
  const color = BLOCKS.find(b=>b.id===state.block).color;
  const rgb = hexToRgb(color);
  btn.style.background = `rgba(${rgb},0.2)`;
  btn.style.border = `1px solid rgba(${rgb},0.4)`;
  btn.style.color = color;
}

function resetTimer() {
  clearInterval(timerInterval); timerActive=false; timerRemain=timerPreset;
  updateTimerUI();
  document.querySelectorAll(".timer-btn").forEach(b=>{
    b.style.background="rgba(255,255,255,0.05)";b.style.border="1px solid rgba(255,255,255,0.08)";b.style.color="rgba(232,230,224,0.45)";
  });
}

function updateTimerUI() {
  const color = BLOCKS.find(b=>b.id===state.block).color;
  const pct = timerRemain / timerPreset;
  const offset = CIRC * (1 - pct);
  const arc = document.getElementById("timer-arc");
  const timeEl = document.getElementById("timer-time");
  arc.style.strokeDashoffset = offset;
  arc.style.stroke = timerActive ? color : "rgba(255,255,255,0.2)";
  const m = Math.floor(timerRemain/60);
  const s = String(timerRemain%60).padStart(2,"0");
  timeEl.textContent = `${m}:${s}`;
  timeEl.style.color = timerActive ? color : "rgba(232,230,224,0.5)";
}

// ── 렌더
function doneKey(exId){ return `b${state.block}_w${state.week}_${exId}`; }
function isDone(exId){ return !!completed[doneKey(exId)]; }
function toggleDone(exId){
  const key = doneKey(exId);
  if(completed[key]) delete completed[key]; else completed[key]=1;
  save(completed); renderSession();
}

function render() {
  const block = BLOCKS.find(b=>b.id===state.block);
  const rgb = hexToRgb(block.color);

  // RPE 배지
  const badge = document.getElementById("rpe-badge");
  badge.textContent = block.rpe;
  badge.style.background = `rgba(${rgb},0.12)`;
  badge.style.borderColor = `rgba(${rgb},0.3)`;
  badge.style.color = block.color;

  // 블록 탭
  const blockTabs = document.getElementById("block-tabs");
  blockTabs.innerHTML = BLOCKS.map(b=>`
    <button onclick="selectBlock(${b.id})" style="
      flex-shrink:0;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;
      cursor:pointer;transition:all 0.2s;font-family:inherit;
      background:${state.block===b.id?b.color:'rgba(255,255,255,0.05)'};
      color:${state.block===b.id?'#0A0A0C':'rgba(232,230,224,0.5)'};
    ">${b.label} <span style="opacity:0.7;font-weight:400">${b.sub}</span></button>
  `).join("");

  // 주차 탭
  const weekTabs = document.getElementById("week-tabs");
  weekTabs.innerHTML = block.weeks.map(w=>`
    <button class="week-tab" onclick="selectWeek(${w})" style="
      background:${state.week===w?`rgba(${rgb},0.15)`:'rgba(255,255,255,0.04)'};
      color:${state.week===w?block.color:'rgba(232,230,224,0.4)'};
      border-color:${state.week===w?`rgba(${rgb},0.35)`:'transparent'};
    ">${w}주차</button>
  `).join("");

  // Day 탭
  const dayTabs = document.getElementById("day-tabs");
  dayTabs.innerHTML = ["A","B","C","D"].map(d=>{
    const s = BASE_SESSIONS[d];
    const isActive = state.day===d;
    const typeColor = s.type==="수업"?"#9B8FFF":block.color;
    return `<button class="day-tab ${isActive?'active':''}" onclick="selectDay('${d}')">
      <div class="day-tab-label">${s.label}</div>
      <div class="day-tab-type" style="color:${typeColor};opacity:${isActive?1:0.6}">${s.type==="수업"?"수업":"개인"}</div>
    </button>`;
  }).join("");

  renderSession();
  updateTimerUI();
}

function renderSession() {
  const block = BLOCKS.find(b=>b.id===state.block);
  const rgb = hexToRgb(block.color);
  const rawSession = BASE_SESSIONS[state.day];
  const exercises = scaleExercises(rawSession.exercises, state.block);
  const doneCount = exercises.filter(e=>isDone(e.id)).length;
  const progress = exercises.length ? doneCount/exercises.length : 0;

  document.getElementById("session-title").textContent = rawSession.tag;
  document.getElementById("session-sub").textContent = `${state.week}주차 · ${block.label} · ${block.sub}`;
  document.getElementById("count-num").textContent = `${doneCount}/${exercises.length}`;
  document.getElementById("count-num").style.color = block.color;
  document.getElementById("progress-fill").style.width = `${progress*100}%`;
  document.getElementById("progress-fill").style.background = `linear-gradient(90deg,rgba(${rgb},0.6),${block.color})`;

  const checkSVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A0A0C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  document.getElementById("exercises").innerHTML = exercises.map((ex,i)=>{
    const done = isDone(ex.id);
    const cardBg = done?`rgba(${rgb},0.1)`:"rgba(255,255,255,0.04)";
    const cardBorder = done?`rgba(${rgb},0.3)`:"rgba(255,255,255,0.07)";
    const numBg = done?block.color:"rgba(255,255,255,0.06)";
    const numBorder = done?"none":"1px solid rgba(255,255,255,0.12)";
    const numContent = done ? checkSVG : `<span style="font-size:12px;font-weight:700;color:rgba(232,230,224,0.35)">${i+1}</span>`;
    const nameColor = done?`rgba(${rgb},0.85)`:"#E8E6E0";

    const chipsHtml = ex.sets ? `
      <div class="chips">
        <span class="chip" style="background:rgba(${rgb},0.1);border-color:rgba(${rgb},0.2);color:${block.color}">${ex.sets}세트 × ${ex.reps}회</span>
        <span class="chip" style="background:rgba(${rgb},0.1);border-color:rgba(${rgb},0.2);color:${block.color}">${ex.weight}</span>
        <span class="chip" style="background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.07);color:rgba(232,230,224,0.3)">${block.rpe}</span>
      </div>` : `<div class="ex-no-content">${ex.note}</div>`;

    const noteHtml = ex.sets ? `<div class="ex-note">${ex.note}</div>` : "";

    return `<div class="ex-card ${ex.sets?'':'no-action'}"
      style="background:${cardBg};border-color:${cardBorder};"
      onclick="${ex.sets?`toggleEx('${ex.id}')`:''}"
    >
      <div class="ex-num" style="background:${numBg};border:${numBorder}">${numContent}</div>
      <div class="ex-info">
        <div class="ex-name" style="color:${nameColor}">${ex.name}</div>
        ${chipsHtml}
      </div>
      ${noteHtml}
    </div>`;
  }).join("");
}

function toggleEx(id){ toggleDone(id); }
function selectBlock(id){ state.block=id; state.week=BLOCKS.find(b=>b.id===id).weeks[0]; render(); }
function selectWeek(w){ state.week=w; render(); }
function selectDay(d){ state.day=d; render(); }

function initApp(){ render(); }

// DOMContentLoaded 이후 initApp (비밀번호 통과했을 때 즉시 실행)
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",()=>{ if(sessionStorage.getItem("ky_auth")==="1") initApp(); });
}
</script>
</body>
</html>
