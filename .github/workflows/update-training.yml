name: Update Training App

on:
  workflow_dispatch:
    inputs:
      gist_id:
        description: 'Gist ID (training.html이 있는 Gist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAINING_DEPLOY_TOKEN }}

      - name: Download from Gist
        run: |
          curl -H "Authorization: token ${{ secrets.TRAINING_DEPLOY_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               "https://api.github.com/gists/${{ github.event.inputs.gist_id }}" \
               -o gist_response.json
          python3 -c "
          import json
          data = json.load(open('gist_response.json'))
          files = data.get('files', {})
          for fname, fdata in files.items():
              if fname.endswith('.html'):
                  open('static/training/index.html', 'w').write(fdata['content'])
                  print(f'저장 완료: {fname}')
                  break
          "

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/training/index.html
          git diff --cached --quiet || git commit -m "feat: training app 업데이트"
          git push
